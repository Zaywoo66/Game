name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  foundation:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: clippy, rustfmt
          target: x86_64-pc-windows-msvc
      - uses: actions/setup-node@v4
        with:
          node-version: '24.14.1'
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
        working-directory: ui
      - run: npm run lint
        working-directory: ui
      - run: npm run typecheck
        working-directory: ui
      - run: npm run build
        working-directory: ui
      - run: npx --no-install playwright install chromium
        working-directory: ui
      - run: npm run test:map
        working-directory: ui
      - name: Upload browser failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-failure-diagnostics
          path: ui/node_modules/.cache/map-test-results
          if-no-files-found: ignore
          retention-days: 7
      - run: cargo fmt --check
      - name: Reject floating-point types in the simulation
        shell: pwsh
        run: |
          git grep -n -E 'f32|f64' -- crates/sim
          if ($LASTEXITCODE -eq 0) { throw 'Floating-point types are forbidden in crates/sim.' }
          if ($LASTEXITCODE -ne 1) { exit $LASTEXITCODE }
          exit 0
      - run: cargo clippy --all-targets -- -D warnings
      - name: Workspace tests including three-seed AI smoke
        run: cargo test --workspace
      - run: python -m pip install --requirement tools/requirements.txt --requirement tools/map/requirements.txt
      - run: python tools/lint_data.py
      - run: python -B -m unittest discover -s tools/tests
      - run: python -B -m unittest discover -s tools/map/tests
      - run: python tools/map/validate.py --region western_europe
      - run: cargo run --locked -p strategy-data --bin lint-provinces -- data/map/western_europe/provinces.json
      - run: cargo run --locked -p strategy-data --bin lint-scenario -- data/scenarios/1440.json data/map/western_europe/provinces.json
      - run: cargo build --locked -p strategy-app --features custom-protocol --bin strategy-app
      - uses: actions/upload-artifact@v4
        with:
          name: strategy-windows-x64
          path: target/debug/strategy-app.exe
          if-no-files-found: error

