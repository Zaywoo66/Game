[package]
name = "strategy-app"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
build = "build.rs"
default-run = "strategy-app"

[features]
custom-protocol = ["tauri/custom-protocol"]

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
tauri = "=2.12.5"
tokio = { version = "=1.54.1", features = ["macros", "net", "rt", "sync", "time"] }
strategy-sim = { path = "../crates/sim" }
strategy-net = { path = "../crates/net" }
strategy-data = { path = "../crates/data" }
strategy-ai = { path = "../crates/ai" }

[build-dependencies]
tauri-build = "=2.7.4"

