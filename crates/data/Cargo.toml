[package]
name = "strategy-data"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

[dependencies]
strategy-sim = { path = "../sim" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.154", features = ["raw_value"] }
sha2 = "=0.10.9"
yaml_serde = "=0.10.7"

[dev-dependencies]
criterion = { version = "=0.5.1", default-features = false }

[[bench]]
name = "tick"
harness = false
