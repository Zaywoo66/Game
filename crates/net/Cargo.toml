[package]
name = "strategy-net"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

[dependencies]
strategy-sim = { path = "../sim" }
getrandom = "=0.3.4"
if-addrs = "=0.15.0"
mdns-sd = "=0.21.6"
postcard = { version = "=1.1.3", default-features = false, features = ["use-std"] }
serde = { version = "=1.0.229", features = ["derive"] }
sha2 = "=0.10.9"
tokio = { version = "=1.54.1", features = ["io-util", "macros", "net", "rt", "sync", "time"] }
