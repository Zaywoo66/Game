    ai_weight: 10
    ai_weight_if:
      when: {country_has_tech: agrarian_reform}
      add: 5
    effects:
      - add_modifier: {key: harvest_tax, value: 100, kind: multiplicative, duration_days: 30}
  - text: event_harvest_decline
    ai_weight: 1
    effects: []
